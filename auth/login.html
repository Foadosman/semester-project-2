<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BidWorld</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <nav class="site-navbar">
            <div class="nav-container d-flex align-items-center justify-content-between w-100">
                <a href="../index.html" class="logo">Bidworld</a>
                <div class="nav-links d-flex justify-content-center flex-grow-1 gap-4">
                    <a href="../index.html">Home</a>
                    <a href="./listings/index.html">Listings</a>
                </div>
                <div class="nav-actions">
                    <a href="../auth/login.html" class="btn btn-primary-custom">Login</a>
                    <a href="../auth/register.html" class="btn btn-secondary-custom">Register</a>
                    <div id="mobileNavigations"></div>
                </div>
                <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
            </div>
        </nav>
    </header>
    <main class="container mt-5">
        <h1 class="mb-4 text-center">Login</h1>
        <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="auth-card p-4">
                <img src="../assets/icons/bid-world-logo.png" class="auth-logo">
                <div id="loginMessage"></div>
        <form id="loginForm" class="d-flex flex-column gap-4">
            <input
                type="email"
                id="loginEmail"
                class="form-control"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                class="form-control"
                placeholder="Password"
                required
            >

            <p>Don't have an account? <a href="/auth/register.html">Click here</a> to register</p>
            <button type="submit" class="btn btn-primary-custom">Login</button>
        </form>
        </div>
        </div>
    </div>
    </main>
    <script type="module" src="../scripts/navbar.js"></script>
    <script type="module" src="../scripts/auth.js"></script>
</body>
</html>
