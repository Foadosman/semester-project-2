<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | BidWorld</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <header>
      <nav class="site-navbar">
        <div
          class="nav-container d-flex align-items-center justify-content-between w-100"
        >
          <a href="../index.html" class="logo"
            ><img
              src="../assets/icons/bid-world-logo.png"
              alt="Bidworld logo"
              class="logo-img"
          /></a>
          <div
            class="nav-links d-flex justify-content-center flex-grow-1 gap-4"
          >
            <a href="../index.html">Home</a>
            <a href="../listings/index.html">Listings</a>
          </div>
          <div class="nav-actions" id="navActions">
            <a href="../auth/login.html" class="btn btn-primary-custom"
              >Login</a
            >
            <a href="../auth/register.html" class="btn btn-secondary-custom"
              >Register</a
            >
          </div>
          <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
        </div>
      </nav>
      <div id="mobileMenu" class="mobile-menu">
        <div id="mobileUserInfo"></div>
        <a href="../index.html">Home</a>
        <a href="../listings/index.html">Listings</a>
        <div id="mobileNavActions"></div>
      </div>
    </header>
    <main class="container mt-5">
      <h1 class="mb-4 text-center">Register</h1>
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="auth-card p-4">
            <img src="../assets/icons/bid-world-logo.png" class="auth-logo" />
            <div id="registerMessage"></div>
            <form id="registerForm" class="d-flex flex-column gap-4">
              <input
                type="text"
                id="name"
                class="form-control"
                placeholder="Username"
                required
              />

              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Email (@stud.noroff.no)"
                required
              />

              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="password"
                required
              />

              <p>
                Already have an account?
                <a href="/auth/login.html">Click here</a> to log in!
              </p>
              <button type="submit" class="btn btn-primary-custom">
                Register
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="../scripts/navbar.js"></script>
    <script type="module" src="../scripts/auth.js"></script>
  </body>
</html>
