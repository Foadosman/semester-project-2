<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | BidWorld</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header>
      <nav class="site-navbar">
        <div class="nav-container d-flex align-items-center justify-content-between w-100">
          <a href="/index.html" class="logo"><img src="./assets/icons/bid-world-logo.png" alt="Bidworld logo" class="logo-img"></a>
          <div class="nav-links d-flex justify-content-center flex-grow-1 gap-4">
            <a href="./index.html">Home</a>
            <a href="./listings/index.html">Listings</a>
          </div>
          <div class="nav-actions" id="navActions">
            <a href="./auth/login.html" class="btn btn-primary-custom">Login</a>
            <a href="./auth/register.html" class="btn btn-secondary-custom">Register</a>
          </div>
          <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
        </div>
      </nav>
      <div id="mobileMenu" class="mobile-menu">
        <div id="mobileUserInfo"></div>
        <a href="./index.html">Home</a>
        <a href="./listings/index.html">Listings</a>
        <div id="mobileNavActions"></div>
      </div>
    </header>
    <main>
      <section class="hero-section mt-4">
        <div class="container">
          <div
            id="carouselContainer"
            class="hero-carousel rounded overflow-hidden"
          >
            <div id="carouselContent" class="carousel-content"></div>
          </div>
        </div>
      </section>

      <section class="search-section mt-3 mb-3">
        <div class="container">
          <form class="search-form mb-0">
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Search listings..."
            />
          </form>
        </div>
      </section>

      <section class="home-listings-section mt-4">
        <div class="container">
          <div
            class="section-heading d-flex justify-content-between align-items-center"
          >
            <h2 class="mb-0">Latest Listings</h2>
            <a href="./listings/index.html" class="view-all-link">View all listings</a>
          </div>
          <div id="homeListingsGrid" class="row g-4"></div>
        </div>
      </section>
    </main>
    <script type="module" src="./scripts/home.js" defer></script>
    <script type="module" src="./scripts/navbar.js" defer></script>
  </body>
</html>
