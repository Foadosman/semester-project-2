<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <nav class="site-navbar">
            <div class="nav-container d-flex align-items-center justify-content-between w-100">
                <a href="./index.html" class="logo">Bidworld</a>

                <div class="nav-links d-flex justify-content-center flex-grow-1 gap-4">
                    <a href="./index.html">Home</a>
                    <a href="./listings/index.html">Listings</a>
                </div>

                <div class="nav-actions">
                    <a href="./auth/login.html" class="btn btn-primary-custom">Login</a>
                    <a href="./auth/register.html" class="btn btn-secondary-custom">Register</a>
                </div>
            </div>
        </nav>
    </header>
    <main class="container mt-4">
        <h1 class="mb-4">Create Listing</h1>
        <form id="createListingForm" class="d-flex flex-column gap-3">
            <input
                type="text"
                id="title"
                class="form-control"
                placeholder="Title"
                required
            >

            <textarea
                id="description"
                class="form-control"
                placeholder="Description"
                rows="5"
            ></textarea>

            <input
                type="datetime-local"
                id="endsAt"
                class="form-control"
                required
            >

            <input
                type="url"
                id="imageUrl1"
                class="form-control"
                placeholder="image URL 1"
            >

            <input
                type="url"
                id="imageUrl2"
                class="form-control"
                placeholder="image URL 2"
            >

            <input
                type="url"
                id="imageUrl3"
                class="form-control"
                placeholder="Image URL 3"
            >

            <button type="submit" class="btn btn-primary-custom">Create Listing</button>
        </form>
    </main>
    <script type="module" src="../scripts/createListing.js"></script>
    <script type="module" src="../scripts/navbar.js"></script>
</body>
</html>
