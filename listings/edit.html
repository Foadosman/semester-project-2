<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit listing | Bidworld</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <nav class="site-navbar">
        <div class="nav-container d-flex align-items-center justify-content-between w-100">
          <a href="../index.html" class="logo"><img src="../assets/icons/bid-world-logo.png" alt="Bidworld logo" class="logo-img"></a>
          <div class="nav-links d-flex justify-content-center flex-grow-1 gap-4">
            <a href="../index.html">Home</a>
            <a href="../listings/index.html">Listings</a>
          </div>
          <div class="nav-actions" id="navActions">
            <a href="../auth/login.html" class="btn btn-primary-custom">Login</a>
            <a href="../auth/register.html" class="btn btn-secondary-custom">Register</a>
          </div>
          <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
        </div>
      </nav>
      <div id="mobileMenu" class="mobile-menu">
        <div id="mobileUserInfo"></div>
        <a href="../index.html">Home</a>
        <a href="./index.html">Listings</a>
        <div id="mobileNavActions"></div>
      </div>
    </header>
    <main class="container mt-4">
        <h1 class="mb-4">Edit Listing</h1>
        <form id="editListingForm" class="d-flex flex-column gap-3">
            <input
                type="text"
                id="title"
                class="form-control"
                placeholder="Title"
                required
            >

            <textarea
                id="description"
                class="form-control"
                placeholder="Description"
                rows="5"
            ></textarea>

            <input
                type="datetime-local"
                id="endsAt"
                class="form-control"
                disabled
            >
            <small class="text muted">End date cannot be changed after creation</small>

            <input
                type="url"
                id="imageUrl1"
                class="form-control"
                placeholder="Image URL 1"
            >

            <input
                type="url"
                id="imageUrl2"
                class="form-control"
                placeholder="Image URL 2"
            >

            <input
                type="url"
                id="imageUrl3"
                class="form-control"
                placeholder="Image URL 3"
            >

            <button type="submit" class="btn btn-primary-custom">Update Listing</button>
        </form>
    </main>
    <script type="module" src="../scripts/editListing.js"></script>
    <script type="module" src="../scripts/navbar.js"></script>
</body>
</html>
