<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit profile | BidWorld</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
    <header>
      <header>
      <nav class="site-navbar">
        <div class="nav-container d-flex align-items-center justify-content-between w-100">
          <a href="../index.html" class="logo"><img src="./assets/icons/bid-world-logo.png" alt="Bidworld logo" class="logo-img"></a>
          <div class="nav-links d-flex justify-content-center flex-grow-1 gap-4">
            <a href="../index.html">Home</a>
            <a href="../listings/index.html">Listings</a>
          </div>
          <div class="nav-actions" id="navActions">
            <a href="../auth/login.html" class="btn btn-primary-custom">Login</a>
            <a href="../auth/register.html" class="btn btn-secondary-custom">Register</a>
          </div>
          <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
        </div>
      </nav>
      <div id="mobileMenu" class="mobile-menu">
        <a href=".index.html">Home</a>
        <a href="./listings/index.html">Listings</a>
        <div id="mobileNavActions"></div>
      </div>
    </header>
    <main class="container mt-4">
        <h1 class="mb-4">Edit Profile</h1>
        <form id="editProfileForm" class="d-flex flex-column gap-3">
            <input
                type="text"
                id="bio"
                class="form-control"
                placeholder="Bio"
            >

            <input
                type="url"
                id="avatar"
                class="form-control"
                placeholder="Avatar URL"
            >

            <input
                type="url"
                id="banner"
                class="form-control"
                placeholder="Banner URL"
            >

            <button type="submit" class="btn btn-primary-custom">Update Profile</button>
        </form>
    </main>
    <script type="module" src="../scripts/editProfile.js"></script>
    <script type="module" src="../scripts/navbar.js"></script>
</body>
</html>
