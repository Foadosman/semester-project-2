<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | BidWorld</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
    <header>
      <nav class="site-navbar">
        <div class="nav-container d-flex align-items-center justify-content-between w-100">
          <a href="../index.html" class="logo"><img src="./assets/icons/bid-world-logo.png" alt="Bidworld logo" class="logo-img"></a>
          <div class="nav-links d-flex justify-content-center flex-grow-1 gap-4">
            <a href="../index.html">Home</a>
            <a href="../listings/index.html">Listings</a>
          </div>
          <div class="nav-actions" id="navActions">
            <a href="../auth/login.html" class="btn btn-primary-custom">Login</a>
            <a href="../auth/register.html" class="btn btn-secondary-custom">Register</a>
          </div>
          <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
        </div>
      </nav>
      <div id="mobileMenu" class="mobile-menu">
        <a href="../index.html">Home</a>
        <a href="../listings/index.html">Listings</a>
        <div id="mobileNavActions"></div>
      </div>
    </header>
    <main class="container mt-4">
        <h1 class="mb-4">My profile</h1>
        <div id="profileInfo" class="mb-5"></div>
        <div class="d-flex justify-content mb-3">
          <a href="../listings/create.html" class="btn btn-primary-custom">Create listing</a>
        </div>
        <h2 class="mb-3">My listings</h2>
        <div id="profileListings" class="row g-4"></div>
        <section class="mt=5">
            <h2>Listings I have bid on</h2>
            <div id="profileBids" class="row g-4"></div>
        </section>
    </main>
    <script type="module" src="../scripts/profile.js"></script>
    <script type="module" src="../scripts/navbar.js"></script>
</body>
</html>
